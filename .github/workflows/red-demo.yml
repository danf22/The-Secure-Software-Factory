name: Red Demo — Vulnerable Code Detection

# Demonstrates that the security pipeline BLOCKS insecure code.
# The vulnerable-app/ and iac/vulnerable/ intentionally contain security flaws.
# This workflow verifies the policy gate catches them all.

on:
  workflow_dispatch:
  push:
    branches:
      - 'demo/**'

permissions:
  contents: read
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Secrets Scanning — Gitleaks (targeting vulnerable-app/)
  # ─────────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: "Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Gitleaks
        run: |
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks on vulnerable-app/
        id: gitleaks
        run: |
          set +e
          gitleaks detect \
            --source vulnerable-app/ \
            --no-git \
            --report-format sarif \
            --report-path gitleaks-results.sarif
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 1 ]; then
            echo "findings_detected=true" >> "$GITHUB_OUTPUT"
            echo "✅ Gitleaks detected secrets (expected for red demo)"
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "findings_detected=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No secrets found — unexpected for vulnerable-app"
          else
            echo "findings_detected=error" >> "$GITHUB_OUTPUT"
            echo "❌ Gitleaks encountered an error (exit code: $EXIT_CODE)"
          fi

      - name: Generate Gitleaks layer report
        if: always()
        run: |
          mkdir -p red-demo-reports
          cat > red-demo-reports/secrets-layer.json << 'EOF'
          {
            "layer": "secrets",
            "scanner": "gitleaks",
            "target": "vulnerable-app/",
            "findings_detected": "${{ steps.gitleaks.outputs.findings_detected }}"
          }
          EOF

      - name: Upload Gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-gitleaks-sarif
          path: gitleaks-results.sarif
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload layer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-secrets-layer
          path: red-demo-reports/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # SAST Scanning — Semgrep (targeting vulnerable-app/)
  # ─────────────────────────────────────────────────────────────────────────────
  sast-scan:
    name: "SAST Scan (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep on vulnerable-app/
        id: semgrep
        run: |
          set +e
          semgrep scan \
            --config "p/python" \
            --config "p/security-audit" \
            --sarif \
            --output semgrep-results.sarif \
            vulnerable-app/
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 1 ]; then
            echo "findings_detected=true" >> "$GITHUB_OUTPUT"
            echo "✅ Semgrep detected SAST vulnerabilities (expected for red demo)"
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "findings_detected=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No SAST findings — unexpected for vulnerable-app"
          else
            echo "findings_detected=error" >> "$GITHUB_OUTPUT"
            echo "❌ Semgrep encountered an error (exit code: $EXIT_CODE)"
          fi

      - name: Generate SAST layer report
        if: always()
        run: |
          mkdir -p red-demo-reports
          cat > red-demo-reports/sast-layer.json << 'EOF'
          {
            "layer": "sast",
            "scanner": "semgrep",
            "target": "vulnerable-app/",
            "findings_detected": "${{ steps.semgrep.outputs.findings_detected }}"
          }
          EOF

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-semgrep-sarif
          path: semgrep-results.sarif
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload layer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-sast-layer
          path: red-demo-reports/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # SCA Scanning — Trivy filesystem (targeting vulnerable-app/)
  # ─────────────────────────────────────────────────────────────────────────────
  sca-scan:
    name: "SCA Scan (Trivy FS)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan on vulnerable-app/
        id: trivy_fs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: vulnerable-app/
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"
        continue-on-error: true

      - name: Check Trivy FS results
        run: |
          if [ "${{ steps.trivy_fs.outcome }}" == "failure" ]; then
            echo "findings_detected=true" >> "$GITHUB_OUTPUT"
            echo "✅ Trivy detected SCA vulnerabilities (expected for red demo)"
          else
            echo "findings_detected=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No SCA findings — unexpected for vulnerable-app"
          fi

      - name: Generate SCA layer report
        if: always()
        run: |
          mkdir -p red-demo-reports
          DETECTED="false"
          if [ "${{ steps.trivy_fs.outcome }}" == "failure" ]; then
            DETECTED="true"
          fi
          cat > red-demo-reports/sca-layer.json << EOF
          {
            "layer": "sca",
            "scanner": "trivy-fs",
            "target": "vulnerable-app/",
            "findings_detected": "${DETECTED}"
          }
          EOF

      - name: Upload Trivy FS SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-trivy-fs-sarif
          path: trivy-fs-results.sarif
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload layer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-sca-layer
          path: red-demo-reports/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # IaC Scanning — Checkov (targeting iac/vulnerable/)
  # ─────────────────────────────────────────────────────────────────────────────
  iac-scan:
    name: "IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov on iac/vulnerable/
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: iac/vulnerable/
          output_format: sarif
          output_file_path: results
          soft_fail: false
        continue-on-error: true

      - name: Check Checkov results
        run: |
          # Checkov writes to results/results_sarif.sarif
          if [ -f results/results_sarif.sarif ]; then
            cp results/results_sarif.sarif checkov-results.sarif
          fi
          if [ "${{ steps.checkov.outcome }}" == "failure" ]; then
            echo "findings_detected=true" >> "$GITHUB_OUTPUT"
            echo "✅ Checkov detected IaC misconfigurations (expected for red demo)"
          else
            echo "findings_detected=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No IaC findings — unexpected for vulnerable Terraform"
          fi

      - name: Generate IaC layer report
        if: always()
        run: |
          mkdir -p red-demo-reports
          DETECTED="false"
          if [ "${{ steps.checkov.outcome }}" == "failure" ]; then
            DETECTED="true"
          fi
          cat > red-demo-reports/iac-layer.json << EOF
          {
            "layer": "iac",
            "scanner": "checkov",
            "target": "iac/vulnerable/",
            "findings_detected": "${DETECTED}"
          }
          EOF

      - name: Upload Checkov SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-checkov-sarif
          path: checkov-results.sarif
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload layer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-iac-layer
          path: red-demo-reports/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Docker Image (for container scanning)
  # ─────────────────────────────────────────────────────────────────────────────
  build-image:
    name: "Build Vulnerable Image"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: vulnerable-app/
          push: false
          load: true
          tags: vulnerable-app:red-demo-${{ github.sha }}

      - name: Save Docker image
        run: docker save vulnerable-app:red-demo-${{ github.sha }} -o vulnerable-app-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-docker-image
          path: vulnerable-app-image.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Container Scanning — Trivy image (targeting built vulnerable image)
  # ─────────────────────────────────────────────────────────────────────────────
  container-scan:
    name: "Container Scan (Trivy Image)"
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: red-demo-docker-image

      - name: Load Docker image
        run: docker load -i vulnerable-app-image.tar

      - name: Run Trivy image scan
        id: trivy_image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vulnerable-app:red-demo-${{ github.sha }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"
        continue-on-error: true

      - name: Check Trivy Image results
        run: |
          if [ "${{ steps.trivy_image.outcome }}" == "failure" ]; then
            echo "findings_detected=true" >> "$GITHUB_OUTPUT"
            echo "✅ Trivy detected container vulnerabilities (expected for red demo)"
          else
            echo "findings_detected=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No container findings — unexpected for vulnerable image"
          fi

      - name: Generate Container layer report
        if: always()
        run: |
          mkdir -p red-demo-reports
          DETECTED="false"
          if [ "${{ steps.trivy_image.outcome }}" == "failure" ]; then
            DETECTED="true"
          fi
          cat > red-demo-reports/container-layer.json << EOF
          {
            "layer": "container",
            "scanner": "trivy-image",
            "target": "vulnerable-app:red-demo-${{ github.sha }}",
            "findings_detected": "${DETECTED}"
          }
          EOF

      - name: Upload Trivy Image SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-trivy-image-sarif
          path: trivy-image-results.sarif
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload layer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-container-layer
          path: red-demo-reports/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Policy Gate — Aggregate, Evaluate, and ASSERT failure
  # This is the core of the red demo: we expect violations from every layer
  # ─────────────────────────────────────────────────────────────────────────────
  policy-gate:
    name: "Policy Gate (Assert Failure)"
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast-scan, sca-scan, iac-scan, container-scan]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Download all SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: red-demo-*-sarif
          path: sarif-results/
          merge-multiple: false

      - name: Aggregate SARIF results
        run: |
          SARIF_FILES=$(find sarif-results/ -name "*.sarif" -type f | sort)
          if [ -z "$SARIF_FILES" ]; then
            echo "WARNING: No SARIF files found. Creating empty aggregated report."
            echo '{"version":"2.1.0","runs":[]}' > aggregated-results.sarif.json
          else
            echo "Found SARIF files:"
            echo "$SARIF_FILES"
            python scripts/aggregate_sarif.py \
              --mapping config/regulatory-mapping.json \
              $SARIF_FILES > aggregated-results.sarif.json
          fi

      - name: Evaluate policies
        id: evaluate
        run: |
          python << 'PYTHON_SCRIPT'
          import json, sys, os
          sys.path.insert(0, '.')
          from scripts.evaluate_policies import evaluate_policies

          with open('aggregated-results.sarif.json', 'r') as f:
              aggregated = json.load(f)

          decision = evaluate_policies(aggregated, 'policies/opa/')

          decision_dict = {
              'passed': decision.passed,
              'violations': [
                  {
                      'policy_id': v.policy_id,
                      'message': v.message,
                      'resource': v.resource,
                      'severity': v.severity,
                      'regulatory_refs': v.regulatory_refs,
                  }
                  for v in decision.violations
              ],
              'waivers_applied': decision.waivers_applied,
              'timestamp': decision.timestamp,
          }
          with open('policy-decision.json', 'w') as f:
              json.dump(decision_dict, f, indent=2)

          print(f'Policy evaluation: {len(decision.violations)} violation(s) found')
          print(f'Policy gate passed: {decision.passed}')

          if not decision.passed:
              print('🔴 Policy gate FAILED as expected for red demo')
              for v in decision.violations:
                  print(f'  ❌ [{v.severity.upper()}] {v.policy_id}: {v.message} ({v.resource})')
          else:
              print('⚠️ Policy gate PASSED — unexpected for vulnerable code!')
          PYTHON_SCRIPT

      - name: Assert policy gate fails (red demo validation)
        id: assert_failure
        run: |
          python << 'PYTHON_SCRIPT'
          import json, sys

          with open('policy-decision.json', 'r') as f:
              decision = json.load(f)

          violations = decision.get('violations', [])
          passed = decision.get('passed', True)

          # The red demo ASSERTS that the gate fails
          if passed:
              print('❌ RED DEMO BROKEN: Policy gate passed but should have failed!')
              print('   The vulnerable code was NOT detected by the pipeline.')
              sys.exit(2)  # Exit 2 = unexpected pass (demo is broken)

          print('🔴 POLICY GATE BLOCKED: Vulnerable code correctly detected')
          print(f'   Total violations detected: {len(violations)}')

          # Verify we have findings from multiple layers
          policies_triggered = set(v['policy_id'] for v in violations)
          print(f'   Policies triggered: {policies_triggered}')

          # Exit 1 to visually FAIL the job — demonstrating the gate blocks the build
          sys.exit(1)
          PYTHON_SCRIPT

      - name: Upload policy decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-policy-decision
          path: policy-decision.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # SBOM Generation — Syft
  # Generates SBOM even for vulnerable image (demonstrates full evidence chain)
  # ─────────────────────────────────────────────────────────────────────────────
  sbom-generation:
    name: "🔴 SBOM Generation (Syft)"
    runs-on: ubuntu-latest
    needs: [policy-gate, build-image]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: red-demo-docker-image

      - name: Load Docker image
        run: docker load -i vulnerable-app-image.tar

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: vulnerable-app:red-demo-${{ github.sha }}
          format: spdx-json
          output-file: sbom-spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-sbom-spdx
          path: sbom-spdx.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Image Signing — cosign (keyless with GitHub OIDC)
  # Demonstrates signing step even when policy gate fails
  # ─────────────────────────────────────────────────────────────────────────────
  image-signing:
    name: "🔴 Image Signing (cosign)"
    runs-on: ubuntu-latest
    needs: [sbom-generation]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: red-demo-docker-image

      - name: Load Docker image
        run: docker load -i vulnerable-app-image.tar

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          REPO_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' vulnerable-app:red-demo-${{ github.sha }} 2>/dev/null || true)

          if [ -n "$REPO_DIGEST" ]; then
            echo "IMAGE_DIGEST=${REPO_DIGEST}" >> $GITHUB_ENV
            echo "Signing image: ${REPO_DIGEST}"
            cosign sign --yes "${REPO_DIGEST}"
          else
            LOCAL_ID=$(docker inspect --format='{{.Id}}' vulnerable-app:red-demo-${{ github.sha }})
            echo "IMAGE_DIGEST=${LOCAL_ID}" >> $GITHUB_ENV
            echo "Image is local-only (not pushed to a registry). Cosign signing requires a registry."
            echo "Skipping cosign sign — in production, push to a registry first."
            echo "Local image ID: ${LOCAL_ID}"
          fi

      - name: Generate provenance attestation
        run: |
          cat > provenance.json << EOF
          {
            "buildType": "https://slsa.dev/provenance/v0.2",
            "builder": {
              "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@refs/heads/${{ github.ref_name }}",
                "digest": { "sha1": "${{ github.sha }}" },
                "entryPoint": ".github/workflows/red-demo.yml"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}",
              "completeness": { "parameters": true, "environment": true, "materials": true }
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}",
                "digest": { "sha1": "${{ github.sha }}" }
              }
            ]
          }
          EOF

      - name: Save signed image reference
        run: |
          cat > signed-image-ref.json << EOF
          {
            "image": "vulnerable-app",
            "digest": "${IMAGE_DIGEST}",
            "source_repo": "${{ github.repository }}",
            "commit_sha": "${{ github.sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "signing_method": "cosign-keyless-oidc",
            "provenance_type": "slsaprovenance"
          }
          EOF

      - name: Upload signed image reference
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-signed-image-ref
          path: signed-image-ref.json
          retention-days: 30

      - name: Upload provenance attestation
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-provenance-attestation
          path: provenance.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Red Demo Report — Comprehensive summary of all detected violations
  # ─────────────────────────────────────────────────────────────────────────────
  red-demo-report:
    name: "📋 Red Demo Report"
    runs-on: ubuntu-latest
    needs: [policy-gate, image-signing]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download layer reports
        uses: actions/download-artifact@v4
        with:
          pattern: red-demo-*-layer
          path: layer-reports/
          merge-multiple: true

      - name: Download policy decision
        uses: actions/download-artifact@v4
        with:
          name: red-demo-policy-decision
          path: policy-artifacts/
        continue-on-error: true

      - name: Download SARIF results
        uses: actions/download-artifact@v4
        with:
          pattern: red-demo-*-sarif
          path: sarif-artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Generate Red Demo Report
        run: |
          python << 'PYTHON_SCRIPT'
          import json
          import glob
          import os
          from datetime import datetime, timezone

          report = {
              "title": "Red Demo Report — Vulnerable Code Detection",
              "description": "Demonstrates the Secure Software Factory correctly identifies and blocks insecure code",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "commit_sha": os.environ.get("GITHUB_SHA", "unknown"),
              "run_id": os.environ.get("GITHUB_RUN_ID", "unknown"),
              "result": "PASS",  # The red demo PASSES when vulnerabilities ARE detected
              "layers": {},
              "policy_gate": {},
              "summary": {}
          }

          # Collect layer reports
          layer_files = glob.glob("layer-reports/**/*.json", recursive=True)
          layers_with_findings = 0
          total_layers = 0

          for lf in layer_files:
              try:
                  with open(lf, 'r') as f:
                      layer = json.load(f)
                  layer_name = layer.get("layer", "unknown")
                  report["layers"][layer_name] = layer
                  total_layers += 1
                  if layer.get("findings_detected") == "true":
                      layers_with_findings += 1
              except (json.JSONDecodeError, IOError) as e:
                  print(f"Warning: Could not read {lf}: {e}")

          # Collect policy decision
          policy_file = "policy-artifacts/policy-decision.json"
          if os.path.exists(policy_file):
              try:
                  with open(policy_file, 'r') as f:
                      policy = json.load(f)
                  report["policy_gate"] = {
                      "passed": policy.get("passed", True),
                      "violations_count": len(policy.get("violations", [])),
                      "violations": policy.get("violations", [])
                  }
              except (json.JSONDecodeError, IOError):
                  report["policy_gate"] = {"error": "Could not read policy decision"}

          # Count SARIF findings per scanner
          sarif_findings = {}
          sarif_files = glob.glob("sarif-artifacts/**/*.sarif", recursive=True)
          for sf in sarif_files:
              try:
                  with open(sf, 'r') as f:
                      sarif = json.load(f)
                  for run in sarif.get("runs", []):
                      tool_name = run.get("tool", {}).get("driver", {}).get("name", "unknown")
                      results = run.get("results", [])
                      sarif_findings[tool_name] = sarif_findings.get(tool_name, 0) + len(results)
              except (json.JSONDecodeError, IOError):
                  pass

          report["sarif_findings_by_scanner"] = sarif_findings

          # Determine overall red demo result
          gate_failed = not report["policy_gate"].get("passed", True)

          if gate_failed and layers_with_findings > 0:
              report["result"] = "PASS"
              report["summary"] = {
                  "message": "Red demo PASSED: Vulnerable code was correctly detected and blocked",
                  "layers_scanned": total_layers,
                  "layers_with_findings": layers_with_findings,
                  "policy_gate_blocked": True,
                  "total_policy_violations": report["policy_gate"].get("violations_count", 0)
              }
          else:
              report["result"] = "FAIL"
              report["summary"] = {
                  "message": "Red demo FAILED: Pipeline did not fully detect vulnerable code",
                  "layers_scanned": total_layers,
                  "layers_with_findings": layers_with_findings,
                  "policy_gate_blocked": gate_failed,
                  "total_policy_violations": report["policy_gate"].get("violations_count", 0)
              }

          # Write the report
          os.makedirs("red-demo-output", exist_ok=True)
          with open("red-demo-output/red-demo-report.json", "w") as f:
              json.dump(report, f, indent=2)

          # Print human-readable summary
          print("=" * 70)
          print("  RED DEMO REPORT — Secure Software Factory")
          print("=" * 70)
          print(f"  Result:       {report['result']}")
          print(f"  Commit:       {report['commit_sha'][:8]}")
          print(f"  Timestamp:    {report['timestamp']}")
          print("-" * 70)
          print(f"  Layers scanned:        {total_layers}")
          print(f"  Layers with findings:  {layers_with_findings}")
          print(f"  Policy gate blocked:   {gate_failed}")
          print(f"  Total violations:      {report['policy_gate'].get('violations_count', 0)}")
          print("-" * 70)
          print("  Scanning Layer Results:")
          for layer_name, layer_data in report.get("layers", {}).items():
              status = "✅ DETECTED" if layer_data.get("findings_detected") == "true" else "⚠️ NOT DETECTED"
              print(f"    {status} | {layer_name:12s} | {layer_data.get('scanner', 'unknown'):12s} | {layer_data.get('target', 'N/A')}")
          print("-" * 70)
          if sarif_findings:
              print("  SARIF Findings by Scanner:")
              for scanner, count in sarif_findings.items():
                  print(f"    {scanner}: {count} finding(s)")
          print("-" * 70)
          if report["policy_gate"].get("violations"):
              print("  Policy Violations:")
              for v in report["policy_gate"]["violations"]:
                  sev = v.get("severity", "unknown").upper()
                  print(f"    ❌ [{sev}] {v.get('policy_id', 'N/A')}: {v.get('message', 'N/A')}")
                  print(f"       Resource: {v.get('resource', 'N/A')}")
                  refs = v.get("regulatory_refs", [])
                  if refs:
                      print(f"       Regulatory: {', '.join(refs)}")
          print("=" * 70)
          PYTHON_SCRIPT

      - name: Upload Red Demo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-demo-report
          path: red-demo-output/
          retention-days: 90
